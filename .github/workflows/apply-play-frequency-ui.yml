name: Apply play frequency admin UI
on:
  push:
    paths:
      - '.github/workflows/apply-play-frequency-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace raw rules JSON with play frequency control
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/admin/campaign-games/[id]/page.tsx')
          s = p.read_text()
          s = s.replace('type PrizeType = "winning_prize" | "no_prize";', 'type PrizeType = "winning_prize" | "no_prize";\ntype PlayFrequency = "once_per_campaign" | "once_per_day" | "unlimited";')
          old = '''  const [rules, setRules] = useState("{}");'''
          new = '''  const [rules, setRules] = useState<Record<string, unknown>>({});\n  const [playFrequency, setPlayFrequency] =\n    useState<PlayFrequency>("once_per_campaign");'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''      setRules(\n        formatRules(loadedCampaignGame.rules)\n      );'''
          new = '''      const loadedRules = loadedCampaignGame.rules ?? {};\n      setRules(loadedRules);\n      setPlayFrequency(\n        loadedRules.play_frequency === "once_per_day" ||\n        loadedRules.play_frequency === "unlimited"\n          ? loadedRules.play_frequency\n          : "once_per_campaign"\n      );'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    let parsedRules: Record<string, unknown>;\n\n    try {\n      parsedRules = parseRules(rules);\n    } catch (rulesError) {\n      setError(\n        rulesError instanceof Error\n          ? rulesError.message\n          : "Rules contain invalid JSON."\n      );\n      setSaving(false);\n      return;\n    }'''
          new = '''    const parsedRules: Record<string, unknown> = {\n      ...rules,\n      play_frequency: playFrequency,\n    };'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''      setRules(\n        formatRules(\n          updatedCampaignGame.rules\n        )\n      );'''
          new = '''      const savedRules = updatedCampaignGame.rules ?? {};\n      setRules(savedRules);\n      setPlayFrequency(\n        savedRules.play_frequency === "once_per_day" ||\n        savedRules.play_frequency === "unlimited"\n          ? savedRules.play_frequency\n          : "once_per_campaign"\n      );'''
          assert old in s
          s = s.replace(old, new, 1)
          start = s.index('        <div\n          className="admin-panel"\n          style={{ marginTop: "20px" }}\n        >\n          <div style={{ marginBottom: "18px" }}>\n            <div className="eyebrow">\n              RULES')
          end = s.index('\n        {error && (', start)
          new_block = '''        <div\n          className="admin-panel"\n          style={{ marginTop: "20px" }}\n        >\n          <div style={{ marginBottom: "18px" }}>\n            <div className="eyebrow">\n              RULES\n            </div>\n\n            <h2 style={{ margin: "4px 0 6px" }}>\n              Gameplay Rules\n            </h2>\n\n            <p style={{ margin: 0, color: "#6b7280", lineHeight: 1.6 }}>\n              Control how often a customer can play this campaign game using the same mobile number.\n            </p>\n          </div>\n\n          <div style={{ maxWidth: "520px" }}>\n            <label style={{ display: "block", fontWeight: 700, marginBottom: "8px" }}>\n              Play Frequency\n            </label>\n\n            <select\n              value={playFrequency}\n              onChange={(event) => setPlayFrequency(event.target.value as PlayFrequency)}\n              style={{\n                width: "100%",\n                padding: "12px",\n                border: "1px solid #d1d5db",\n                borderRadius: "9px",\n                boxSizing: "border-box",\n                background: "#ffffff",\n              }}\n            >\n              <option value="once_per_campaign">Once per Campaign</option>\n              <option value="once_per_day">Once per Day</option>\n              <option value="unlimited">Unlimited</option>\n            </select>\n\n            <div style={{ marginTop: "8px", fontSize: "13px", color: "#6b7280", lineHeight: 1.5 }}>\n              {playFrequency === "once_per_campaign"\n                ? "Each mobile number can play only once during this campaign."\n                : playFrequency === "once_per_day"\n                ? "Each mobile number can play once per day during this campaign."\n                : "Customers can play multiple times without a frequency restriction."}\n            </div>\n          </div>\n        </div>\n'''
          s = s[:start] + new_block + s[end:]
          p.write_text(s)
      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/apply-play-frequency-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add play frequency control to game rules"
          git push
