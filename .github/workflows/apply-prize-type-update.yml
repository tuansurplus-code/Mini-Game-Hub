name: Apply prize type admin update
on:
  push:
    paths:
      - '.github/workflows/apply-prize-type-update.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prize type UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/admin/campaign-games/[id]/page.tsx')
          s = p.read_text()
          def rep(old,new):
              global s
              assert old in s, 'Expected source block not found'
              s=s.replace(old,new)

          rep('type Prize = {', 'type PrizeType = "winning_prize" | "no_prize";\n\ntype Prize = {')
          rep('  const [prizeActive, setPrizeActive] =\n    useState(true);', '  const [prizeActive, setPrizeActive] =\n    useState(true);\n  const [prizeType, setPrizeType] =\n    useState<PrizeType>("winning_prize");\n  const [prizeMetadata, setPrizeMetadata] =\n    useState<Record<string, unknown>>({});')
          rep('    setPrizeActive(true);\n    setPrizeError("");', '    setPrizeActive(true);\n    setPrizeType("winning_prize");\n    setPrizeMetadata({});\n    setPrizeError("");')
          rep('    setPrizeActive(prize.active);\n    setPrizeError("");', '    setPrizeActive(prize.active);\n    setPrizeType(\n      prize.metadata?.prize_type === "no_prize"\n        ? "no_prize"\n        : "winning_prize"\n    );\n    setPrizeMetadata(prize.metadata ?? {});\n    setPrizeError("");')
          rep('    const inventory =\n      prizeInventory.trim() === ""\n        ? null\n        : Number(prizeInventory);', '    const inventory =\n      prizeType === "no_prize" ||\n      prizeInventory.trim() === ""\n        ? null\n        : Number(prizeInventory);')
          rep('        inventory,\n        active: prizeActive,', '        inventory,\n        active: prizeActive,\n        metadata: {\n          ...prizeMetadata,\n          prize_type: prizeType,\n        },')
          old='''                  prizeActive={\n                    prizeActive\n                  }\n                  setPrizeActive={\n                    setPrizeActive\n                  }'''
          new='''                  prizeActive={\n                    prizeActive\n                  }\n                  setPrizeActive={\n                    setPrizeActive\n                  }\n                  prizeType={prizeType}\n                  setPrizeType={setPrizeType}'''
          assert s.count(old)==2, f'Expected 2 form prop blocks, got {s.count(old)}'
          s=s.replace(old,new)
          rep('''  prizeActive: boolean;\n  setPrizeActive: (\n    value: boolean\n  ) => void;\n};''','''  prizeActive: boolean;\n  setPrizeActive: (\n    value: boolean\n  ) => void;\n  prizeType: PrizeType;\n  setPrizeType: (value: PrizeType) => void;\n};''')
          rep('''  prizeActive,\n  setPrizeActive,\n}: PrizeFormFieldsProps) {''','''  prizeActive,\n  setPrizeActive,\n  prizeType,\n  setPrizeType,\n}: PrizeFormFieldsProps) {''')
          rep('''      <div>\n        <label\n          style={{\n            display: "block",\n            fontWeight: 700,\n            marginBottom: "8px",\n          }}\n        >\n          Prize Name *\n        </label>''','''      <div>\n        <label\n          style={{\n            display: "block",\n            fontWeight: 700,\n            marginBottom: "8px",\n          }}\n        >\n          Prize Type *\n        </label>\n\n        <select\n          value={prizeType}\n          onChange={(event) => {\n            const nextType = event.target.value as PrizeType;\n            setPrizeType(nextType);\n            if (nextType === "no_prize") {\n              setPrizeInventory("");\n            }\n          }}\n          style={{\n            width: "100%",\n            padding: "12px",\n            border: "1px solid #d1d5db",\n            borderRadius: "9px",\n            boxSizing: "border-box",\n            background: "#ffffff",\n          }}\n        >\n          <option value="winning_prize">Winning Prize</option>\n          <option value="no_prize">No Prize / Try Again</option>\n        </select>\n\n        <div style={{ marginTop: "6px", fontSize: "12px", color: "#6b7280" }}>\n          {prizeType === "no_prize"\n            ? "No coupon or inventory will be used for this result."\n            : "Winning prizes can generate a coupon and use inventory."}\n        </div>\n      </div>\n\n      <div>\n        <label\n          style={{\n            display: "block",\n            fontWeight: 700,\n            marginBottom: "8px",\n          }}\n        >\n          Prize Name *\n        </label>''')
          rep('''            value={prizeInventory}\n            onChange={(event) =>\n              setPrizeInventory(\n                event.target.value\n              )\n            }\n            placeholder="Unlimited"''','''            value={prizeInventory}\n            onChange={(event) =>\n              setPrizeInventory(\n                event.target.value\n              )\n            }\n            disabled={prizeType === "no_prize"}\n            placeholder={\n              prizeType === "no_prize"\n                ? "Not applicable"\n                : "Unlimited"\n            }''')
          rep('''            Leave empty for unlimited.''','''            {prizeType === "no_prize"\n              ? "Inventory is not used for no-prize results."\n              : "Leave empty for unlimited."}''')
          p.write_text(s)
      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/apply-prize-type-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add prize type selector to admin prize management"
          git push
